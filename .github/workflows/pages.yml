name: sample → collect → Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Python は uv が .python-version を読んで用意する。依存は uv.lock のとおり
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Test (collector logic against a freshly generated sample repo)
        run: uv run --frozen pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Generate sample repository
        run: uv run --frozen python sample/generate_sample_repo.py build/sample-fw

      - name: Collect
        run: |
          # generated_at をツール側のコミット時刻に固定し、同じ入力なら同じ JSON にする
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          uv run --frozen release-viewer collect build/sample-fw --site _site --name sample-fw

      # サンプルには意図的な違反があるので、check が 1 で終わることを確認する（CIゲートの動作確認）
      - name: Gate behaves as expected
        run: |
          set +e
          uv run --frozen release-viewer check build/sample-fw
          code=$?
          test "$code" -eq 1 || { echo "expected exit 1, got $code"; exit 1; }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # action.yml（composite action）の自己検証: 利用側と同じ `uses:` でサンプルを走査する
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate sample repository
        run: python3 sample/generate_sample_repo.py build/sample-fw

      # main には違反がないので exit 0。--site で画面資産も揃うこと
      - name: Run the action (check main, assemble site)
        uses: ./
        with:
          args: check build/sample-fw --series main --site _site_action

      - name: Site assets are assembled
        run: test -f _site_action/index.html && test -f _site_action/data.js && test -f _site_action/data.json

      # サンプル全体には意図的な違反があるので、exit 1 が action を通して伝わること
      - name: Run the action (gate must fail)
        id: gate
        continue-on-error: true
        uses: ./
        with:
          args: check build/sample-fw

      - name: Exit code propagates through the action
        run: test "${{ steps.gate.outcome }}" = "failure" || { echo "expected the gate step to fail"; exit 1; }

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test, build, action]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
