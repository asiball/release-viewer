[project]
name = "release-viewer"
dynamic = ["version"]
description = "モノレポのリリース系列・hotfix伝播・依存制約を走査して可視化用JSONを出力する"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff==0.16.9"]

[project.scripts]
release-viewer = "release_viewer.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["release_viewer"]

[tool.setuptools.dynamic]
version = {attr = "release_viewer.__version__"}

[tool.setuptools.package-data]
release_viewer = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
