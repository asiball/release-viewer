[project]
name = "release-collect"
version = "0.1.0"
description = "モノレポのリリース系列・hotfix伝播・依存制約を走査して可視化用JSONを出力する"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
release-collect = "release_collect.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["release_collect"]

[tool.pytest.ini_options]
testpaths = ["tests"]
